<script>

"use strict";


/* =========================================================
   CONFIGURATION
   ========================================================= */

const DB_NAME = "TACE_Audio_Player";
const DB_VERSION = 1;
const STORE_NAME = "songs";
const LAST_PLAYBACK_KEY = "TACE_Audio_Player_Last_Playback";

const DEFAULT_RADIO_RECORD = {
    author: "Streemlion",
    title: "Radio Stream",
    urlFileName: "http://radio.streemlion.com:2740/stream"
};

const AUDIO_EXTENSIONS = [
    ".mp3",
    ".wav",
    ".ogg",
    ".oga",
    ".m4a",
    ".aac",
    ".flac",
    ".webm"
];


/* =========================================================
   DOM
   ========================================================= */

const author =
    document.getElementById("author");

const title =
    document.getElementById("title");

const urlFileName =
    document.getElementById("urlFileName");

const urlLyric =
    document.getElementById("urlLyric");

const lyricBtn =
    document.getElementById("lyricBtn");

const saveSongCheckbox =
    document.getElementById("saveSongCheckbox");

const audio =
    document.getElementById("audio");

const stationSelect =
    document.getElementById("stationSelect");

const messageBox =
    document.getElementById("message");

const nowPlayingText =
    document.getElementById("nowPlayingText");

const metadataText =
    document.getElementById("metadata");

const debug =
    document.getElementById("debug");

const pauseCheckbox =
    document.getElementById("pauseCheckbox");

const autoplayCheckbox =
    document.getElementById("autoplayCheckbox");

const repeatCheckbox =
    document.getElementById("repeatCheckbox");

const openYoutubeBtn =
    document.getElementById("openYoutubeBtn");

const youtubePlaylistSelect =
    document.getElementById("youtubePlaylistSelect");

const sourceTypeText =
    document.getElementById("sourceTypeText");


/* =========================================================
   STATE
   ========================================================= */

let db = null;

const state = {

    sourceType: null,

    /*
        db
        csv
        single
        stream
    */

    series: [],

    index: null,

    currentUrl: "",

    previousUrl: "",

    playing: false,

    paused: false
};

let metadataController = null;
let youtubePlayer = null;
let youtubeApiPromise = null;
let youtubePlaylistGeneration = 0;
let youtubeNoAudioSince = null;
let youtubeWatchdogTimer = null;
let handlingYouTubeEnd = false;
let handlingAudioEnd = false;


function rememberLastPlayback(record) {

    try {
        localStorage.setItem(
            LAST_PLAYBACK_KEY,
            JSON.stringify({
                urlFileName: record.urlFileName,
                index: state.index
            })
        );
    }
    catch (error) {
        // Storage may be unavailable in restricted browser contexts.
    }
}


function getLastPlaybackIndex(records) {

    try {
        const saved =
            JSON.parse(localStorage.getItem(LAST_PLAYBACK_KEY));

        if (!saved) {
            return 0;
        }

        const matchingIndex = records.findIndex(record =>
            record.urlFileName === saved.urlFileName
        );

        return matchingIndex >= 0
            ? matchingIndex
            : 0;
    }
    catch (error) {
        return 0;
    }
}


function clearLastPlayback() {

    try {
        localStorage.removeItem(LAST_PLAYBACK_KEY);
    }
    catch (error) {
        // Storage may be unavailable in restricted browser contexts.
    }
}


/* =========================================================
   MESSAGE
   ========================================================= */

function message(text, type="info") {

    messageBox.textContent = text;

    if (type === "error") {

        messageBox.style.background = "#f8d7da";

    } else if (type === "success") {

        messageBox.style.background = "#d4edda";

    } else {

        messageBox.style.background = "#e8f4ff";
    }
}


function setInitializedMessage() {

    if (messageBox.textContent === "Initializing...") {
        message("Ready.");
    }
}


/* =========================================================
   DEBUG
   ========================================================= */

function updateDebug() {

    debug.textContent =
`protocol:       ${location.protocol}
host:           ${location.host}

sourceType:     ${state.sourceType}
index:          ${state.index}
series length:  ${state.series.length}

current URL:    ${state.currentUrl}
previous URL:   ${state.previousUrl}

playing:        ${state.playing}
paused:         ${state.paused}

audio.src:
${audio.src || "(empty)"}
`;
}


/* =========================================================
   DATABASE
   ========================================================= */

function openDB() {

    return new Promise((resolve,reject) => {

        const request =
            indexedDB.open(
                DB_NAME,
                DB_VERSION
            );

        request.onupgradeneeded = function(e) {

            const database =
                e.target.result;

            if (
                !database.objectStoreNames.contains(
                    STORE_NAME
                )
            ) {

                database.createObjectStore(
                    STORE_NAME,
                    {
                        keyPath:"id",
                        autoIncrement:true
                    }
                );
            }
        };

        request.onsuccess = function() {

            db = request.result;

            resolve(db);
        };

        request.onerror = function() {

            reject(request.error);
        };
    });
}


function getRecords() {

    return new Promise((resolve,reject) => {

        const tx =
            db.transaction(
                STORE_NAME,
                "readonly"
            );

        const store =
            tx.objectStore(
                STORE_NAME
            );

        const request =
            store.getAll();

        request.onsuccess =
            () => resolve(request.result);

        request.onerror =
            () => reject(request.error);
    });
}


function saveRecord(record) {

    return new Promise((resolve,reject) => {

        const tx =
            db.transaction(
                STORE_NAME,
                "readwrite"
            );

        const request =
            tx.objectStore(
                STORE_NAME
            ).add({
                author:record.author,
                title:record.title,
                urlFileName:record.urlFileName,
                urlLyric:record.urlLyric || ""
            });

        request.onsuccess =
            () => resolve(request.result);

        request.onerror =
            () => reject(request.error);
    });
}


async function recordExists(record) {

    const records =
        await getRecords();

    return records.some(x =>
        x.author === record.author &&
        x.title === record.title &&
        x.urlFileName === record.urlFileName &&
        (x.urlLyric || "") === (record.urlLyric || "")
    );
}


/* =========================================================
   VALIDATION
   ========================================================= */

function validate(record) {

    if (!record.author.trim())
        throw new Error("Author is required.");

    if (!record.title.trim())
        throw new Error("Title is required.");

    if (!record.urlFileName.trim())
        throw new Error("Url/file is required.");

    if (
        record.author.includes("|") ||
        record.title.includes("|") ||
        record.urlFileName.includes("|")
    ) {

        throw new Error(
            "The | character cannot be used in fields."
        );
    }
}


function csvSafeField(value) {

    return value
        .replace(/\|/g, " - ")
        .replace(/\s+/g, " ")
        .trim();
}


/* =========================================================
   TYPE DETECTION
   ========================================================= */

function isHTTP(value) {

    return /^https?:\/\//i.test(value);
}


function isCSV(value) {

    return value
        .split("?")[0]
        .split("#")[0]
        .toLowerCase()
        .endsWith(".csv");
}


function isM3U(value) {

    const path =
        value
        .split("?")[0]
        .split("#")[0]
        .toLowerCase();

    return path.endsWith(".m3u") || path.endsWith(".m3u8");
}


function youtubeVideoId(value) {

    try {
        const url = new URL(value);

        if (url.hostname === "youtu.be") {
            return url.pathname.slice(1).split("/")[0] || null;
        }

        if (
            url.hostname === "youtube.com" ||
            url.hostname === "www.youtube.com" ||
            url.hostname === "m.youtube.com"
        ) {
            if (url.pathname === "/watch") {
                return url.searchParams.get("v");
            }

            const match =
                url.pathname.match(/^\/(?:embed|shorts|live)\/([^/]+)/);

            return match ? match[1] : null;
        }
    }
    catch (error) {
        return null;
    }

    return null;
}


function youtubePlaybackUrl(value) {

    const videoId = youtubeVideoId(value);

    if (videoId && youtubePlaylistInfo(value)) {
        return value;
    }

    return videoId
        ? `https://www.youtube.com/watch?v=${videoId}`
        : value;
}


function youtubePlaylistInfo(value) {

    try {
        const url = new URL(value);
        const list = url.searchParams.get("list");

        if (!list) {
            return null;
        }

        const requestedIndex = Number.parseInt(
            url.searchParams.get("index"),
            10
        );

        return {
            list,
            index: Number.isFinite(requestedIndex)
                ? Math.max(0, requestedIndex - 1)
                : 0
        };
    }
    catch (error) {
        return null;
    }
}


function isYouTube(value) {

    return Boolean(youtubeVideoId(value));
}


function ensureYouTubeAPI() {

    if (window.YT && window.YT.Player) {
        return Promise.resolve();
    }

    if (youtubeApiPromise) {
        return youtubeApiPromise;
    }

    youtubeApiPromise = new Promise((resolve, reject) => {
        const previousCallback = window.onYouTubeIframeAPIReady;

        window.onYouTubeIframeAPIReady = () => {
            if (previousCallback) {
                previousCallback();
            }
            resolve();
        };

        const script = document.createElement("script");
        script.src = "https://www.youtube.com/iframe_api";
        script.onerror = () => reject(
            new Error("Could not load the YouTube player API.")
        );
        document.head.append(script);
    });

    return youtubeApiPromise;
}


function updateYouTubePlaylist(list, selectedIndex) {

    youtubePlaylistSelect.replaceChildren();
    youtubePlaylistGeneration++;
    const generation = youtubePlaylistGeneration;

    if (!list || !list.length) {
        youtubePlaylistSelect.disabled = true;

        const option = document.createElement("option");
        option.textContent = "No YouTube playlist loaded";
        youtubePlaylistSelect.append(option);
        return;
    }

    youtubePlaylistSelect.disabled = false;

    list.forEach((videoId, index) => {
        const option = document.createElement("option");
        option.value = String(index);
        option.dataset.videoId = videoId;
        option.textContent = `${index + 1}. ${videoId}`;
        option.selected = index === selectedIndex;
        youtubePlaylistSelect.append(option);

        fetch(
            `https://www.youtube.com/oembed?url=${encodeURIComponent(
                `https://www.youtube.com/watch?v=${videoId}`
            )}&format=json`
        )
            .then(response => response.ok ? response.json() : null)
            .then(data => {
                if (
                    generation === youtubePlaylistGeneration &&
                    data &&
                    data.title
                ) {
                    option.textContent =
                        `${index + 1}. ${data.title} (${videoId})`;
                }
            })
            .catch(() => {});
    });
}


function restartYouTubeSource(index = 0) {

    const playlistInfo =
        youtubePlaylistInfo(state.currentUrl);

    if (!youtubePlayer || !isYouTube(state.currentUrl)) {
        return;
    }

    if (playlistInfo) {
        youtubePlayer.loadPlaylist({
            list: playlistInfo.list,
            index
        });
    } else {
        youtubePlayer.loadVideoById(
            youtubeVideoId(state.currentUrl)
        );
    }

    youtubeNoAudioSince = null;
}


function startYouTubeWatchdog() {

    if (youtubeWatchdogTimer) {
        return;
    }

    youtubeWatchdogTimer = setInterval(() => {

        if (
            state.sourceType !== "youtube" ||
            !autoplayCheckbox.checked ||
            repeatCheckbox.checked ||
            !youtubePlaylistInfo(state.currentUrl) ||
            state.paused
        ) {
            youtubeNoAudioSince = null;
            return;
        }

        if (state.playing) {
            youtubeNoAudioSince = null;
            return;
        }

        if (!youtubeNoAudioSince) {
            youtubeNoAudioSince = Date.now();
            return;
        }

        if (Date.now() - youtubeNoAudioSince >= 60000) {
            message(
                "No playlist audio for one minute. Restarting playlist.",
                "info"
            );
            restartYouTubeSource(0);
        }
    }, 1000);
}


async function loadYouTubeSource(videoId, playlistInfo, shouldPlay) {

    if (!playlistInfo) {
        updateYouTubePlaylist([], 0);

        if (shouldPlay) {
            youtubePlayer.loadVideoById(videoId);
        } else {
            youtubePlayer.cueVideoById(videoId);
        }
        return;
    }

    const loadPlaylist = shouldPlay
        ? "loadPlaylist"
        : "cuePlaylist";

    youtubePlayer[loadPlaylist]({
        list: playlistInfo.list,
        index: playlistInfo.index
    });

    for (let attempt = 0; attempt < 20; attempt++) {
        await new Promise(resolve => setTimeout(resolve, 100));

        const playlist = youtubePlayer.getPlaylist();

        if (!playlist || !playlist.length) {
            continue;
        }

        updateYouTubePlaylist(
            playlist,
            youtubePlayer.getPlaylistIndex()
        );

        const videoIndex =
            playlist.indexOf(videoId);

        if (videoIndex >= 0) {
            youtubePlayer[loadPlaylist]({
                list: playlistInfo.list,
                index: videoIndex
            });
        } else {
            youtubePlayer[shouldPlay ? "loadVideoById" : "cueVideoById"](
                videoId
            );
        }

        return;
    }

    youtubePlayer[shouldPlay ? "loadVideoById" : "cueVideoById"](
        videoId
    );
}


async function loadYouTubeRecord(record, shouldPlay) {

    const videoId = youtubeVideoId(record.urlFileName);
    const playlistInfo = youtubePlaylistInfo(record.urlFileName);

    if (!videoId) {
        throw new Error("Invalid YouTube URL.");
    }

    stopMetadataMonitor();
    metadataText.textContent = "YouTube metadata: loading";
    state.currentUrl = record.urlFileName;
    if (
        state.sourceType !== "db" &&
        state.sourceType !== "csv"
    ) {
        state.sourceType = "youtube";
    }
    startYouTubeWatchdog();
    audio.pause();
    audio.removeAttribute("src");
    audio.load();
    openYoutubeBtn.disabled = false;

    await ensureYouTubeAPI();

    if (!youtubePlayer) {
        await new Promise((resolve) => {
            youtubePlayer = new YT.Player("youtubePlayer", {
                width: "1",
                height: "1",
                videoId,
                playerVars: {
                    controls: 0,
                    playsinline: 1,
                    rel: 0,
                    ...(location.protocol === "http:" || location.protocol === "https:"
                        ? {origin: location.origin}
                        : {}),
                    
                },
                events: {
                    onReady: resolve,
                    onStateChange: (event) => {
                        if (event.data === YT.PlayerState.PLAYING) {
                            state.playing = true;
                            state.paused = false;
                            youtubeNoAudioSince = null;
                            updateYouTubeMetadata();
                        } else if (
                            event.data === YT.PlayerState.CUED
                        ) {
                            youtubeNoAudioSince = Date.now();
                            updateYouTubeMetadata();
                        } else if (
                            event.data === YT.PlayerState.ENDED
                        ) {
                            if (handlingYouTubeEnd) {
                                return;
                            }

                            handlingYouTubeEnd = true;

                            if (
                                state.series.length > 1 &&
                                !repeatCheckbox.checked
                            ) {
                                playNextLoadedRecord().catch(error => {
                                    message(
                                        "DB next-record playback failed:\n" +
                                        error.message,
                                        "error"
                                    );
                                }).finally(() => {
                                    handlingYouTubeEnd = false;
                                });
                            } else if (repeatCheckbox.checked) {
                                const currentIndex =
                                    youtubePlayer.getPlaylistIndex();
                                restartYouTubeSource(
                                    currentIndex >= 0 ? currentIndex : 0
                                );
                                handlingYouTubeEnd = false;
                            } else if (
                                autoplayCheckbox.checked &&
                                isYouTube(state.currentUrl) &&
                                !youtubePlaylistInfo(state.currentUrl)
                            ) {
                                restartYouTubeSource();
                                handlingYouTubeEnd = false;
                            } else {
                                state.playing = false;
                                youtubeNoAudioSince = Date.now();
                                handlingYouTubeEnd = false;
                            }
                        }
                        updateDebug();
                    },
                    onError: (event) => {
                        state.playing = false;
                        state.paused = false;
                        message(
                            `YouTube playback failed: ${youtubeErrorMessage(event.data)}`,
                            "error"
                        );
                        updateDebug();
                    }
                }
            });
        });
    }

    await loadYouTubeSource(videoId, playlistInfo, shouldPlay);

    if (shouldPlay) {
        state.playing = false;
        message("YouTube audio is ready; waiting for playback.", "info");
    }
}


async function playYouTubeRecord(record) {

    validate(record);
    showRecord(record);
    updateStationList();

    if (!youtubePlayer) {
        await loadYouTubeRecord(record, true);
    } else {
        const videoId = youtubeVideoId(record.urlFileName);
        const playlistInfo = youtubePlaylistInfo(record.urlFileName);

        await loadYouTubeSource(videoId, playlistInfo, true);
    }

    youtubePlayer.playVideo();
    state.playing = false;
    message("YouTube audio is ready; press PLAY to start.", "info");

    const retryPlayback = () => {
        if (!state.playing && youtubePlayer) {
            youtubePlayer.playVideo();
        }
    };

    document.addEventListener(
        "pointerdown",
        retryPlayback,
        {once: true}
    );
}


function openCurrentYouTube() {

    const record = state.series[state.index];

    if (record && isYouTube(record.urlFileName)) {
        window.open(
            youtubePlaybackUrl(record.urlFileName),
            "_blank",
            "noopener"
        );
    }
}


function updateYouTubeMetadata() {

    if (!youtubePlayer || !youtubePlayer.getVideoData) {
        return;
    }

    const videoData = youtubePlayer.getVideoData();

    if (!videoData.title) {
        return;
    }

    const artist = csvSafeField(videoData.author || "YouTube");
    const videoTitle = csvSafeField(videoData.title);

    author.value = artist;
    title.value = videoTitle;
    nowPlayingText.textContent =
        `${artist} — ${videoTitle}`;
    metadataText.textContent =
        `YouTube metadata: ${artist} — ${videoTitle}`;
}


function youtubeErrorMessage(code) {

    const messages = {
        2: "The YouTube video ID is invalid.",
        5: "The YouTube HTML5 player could not load the video.",
        100: "The YouTube video was not found or is private.",
        101: "The video owner does not allow embedded playback.",
        150: "The video owner does not allow embedded playback.",
        153: "YouTube requires this page to be served over HTTP or HTTPS, not file://."
    };

    return messages[code] || `YouTube player error ${code}.`;
}


function isAudio(value) {

    const v =
        value
        .split("?")[0]
        .split("#")[0]
        .toLowerCase();

    return AUDIO_EXTENSIONS.some(
        ext => v.endsWith(ext)
    );
}


/*
    Anything HTTP/HTTPS which isn't obviously
    a CSV or normal audio file is considered
    a live stream.

    Therefore:

    http://blueswave.radio:8050/flac-md

    is treated as a live radio stream.
*/

function isStream(value) {

    return (
        isHTTP(value) &&
        !isYouTube(value) &&
        !isCSV(value) &&
        !isAudio(value)
    );
}


/* =========================================================
   NORMALIZE SERVER FILE URL
   ========================================================= */

function serverURL(value) {

    /*
        Absolute HTTP/HTTPS:
        leave unchanged.
    */

    if (isHTTP(value))
        return value;

    /*
        Relative:

        song.flac
        ./song.flac
        audio/song.flac

        becomes relative to the page.
    */

    return new URL(
        value,
        document.baseURI
    ).href;
}


function parseM3U(text) {

    const lines =
        text
        .replace(/^\uFEFF/, "")
        .split(/\r?\n/);

    const records = [];
    let pendingTitle = "";

    for (const rawLine of lines) {

        const line = rawLine.trim();

        if (!line) {
            continue;
        }

        if (line.toUpperCase().startsWith("#EXTINF:")) {
            const comma = line.indexOf(",");
            pendingTitle = comma >= 0
                ? line.slice(comma + 1).trim()
                : "Radio stream";
            continue;
        }

        if (line.startsWith("#")) {
            continue;
        }

        const record = {
            author: "Radio",
            title: pendingTitle || line,
            urlFileName: line,
            urlLyric: ""
        };

        validate(record);
        records.push(record);
        pendingTitle = "";
    }

    if (!records.length) {
        throw new Error("M3U playlist contains no streams.");
    }

    return records;
}


/* =========================================================
   NOW PLAYING
   ========================================================= */

function showRecord(record) {

    nowPlayingText.textContent = record
        ? `${record.author} — ${record.title} — ${record.urlFileName}`
        : "Nothing";

    urlLyric.value = record
        ? record.urlLyric || ""
        : "";
}


function fillRecordFields(record) {

    author.value = record.author || "";
    title.value = record.title || "";
    urlFileName.value = record.urlFileName || "";
    urlLyric.value = record.urlLyric || "";
}


function updateSourceType(record) {

    if (!record) {
        sourceTypeText.textContent = "None";
        return;
    }

    if (isYouTube(record.urlFileName)) {
        sourceTypeText.textContent = "YouTube";
    } else if (isStream(record.urlFileName)) {
        sourceTypeText.textContent = "Radio stream";
    } else if (isAudio(record.urlFileName)) {
        sourceTypeText.textContent = "Audio file";
    } else {
        sourceTypeText.textContent = "Playlist or audio source";
    }
}


function stopMetadataMonitor() {

    if (metadataController) {
        metadataController.abort();
        metadataController = null;
    }
}


function updateStreamTitle(text) {

    const match =
        text.match(/StreamTitle='([^']*)'/i);

    if (match && match[1].trim()) {
        const streamTitle = match[1].trim();
        const separator = streamTitle.indexOf(" - ");
        const artist = separator >= 0
            ? streamTitle.slice(0, separator).trim()
            : "Radio";
        const song = separator >= 0
            ? streamTitle.slice(separator + 3).trim()
            : streamTitle;

        author.value = artist;
        title.value = song;
        nowPlayingText.textContent =
            `${artist} — ${song}`;
        metadataText.textContent =
            `Station metadata: ${streamTitle}`;
    }
}


function knownMetadataInterval(url) {

    try {
        const parsed = new URL(url);

        if (
            parsed.hostname === "radio.streemlion.com" &&
            parsed.port === "2740"
        ) {
            return 16000;
        }
    }
    catch (error) {
        return null;
    }

    return null;
}


async function monitorMetadata(url) {

    stopMetadataMonitor();

    metadataController = new AbortController();
    const signal = metadataController.signal;

    metadataText.textContent = "Station metadata: connecting";

    try {
        const response = await fetch(url, {
            headers: {"Icy-MetaData": "1"},
            signal
        });

        if (!response.ok) {
            throw new Error(`Metadata HTTP error ${response.status}`);
        }

        const exposedInterval = Number.parseInt(
            response.headers.get("icy-metaint"),
            10
        );
        const interval = Number.isFinite(exposedInterval)
            ? exposedInterval
            : knownMetadataInterval(url);

        if (!interval || !response.body) {
            throw new Error("Station did not expose ICY metadata.");
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = new Uint8Array(0);
        let audioRemaining = interval;
        let metadataLength = null;
        let metadataBytes = [];

        while (!signal.aborted) {
            const result = await reader.read();

            if (result.done) {
                break;
            }

            const combined = new Uint8Array(
                buffer.length + result.value.length
            );
            combined.set(buffer);
            combined.set(result.value, buffer.length);
            buffer = combined;

            while (buffer.length) {
                if (audioRemaining > 0) {
                    const count = Math.min(audioRemaining, buffer.length);
                    buffer = buffer.slice(count);
                    audioRemaining -= count;
                    continue;
                }

                if (metadataLength === null) {
                    metadataLength = buffer[0] * 16;
                    buffer = buffer.slice(1);

                    if (metadataLength === 0) {
                        audioRemaining = interval;
                        metadataLength = null;
                    }

                    continue;
                }

                if (buffer.length < metadataLength) {
                    metadataBytes.push(buffer);
                    metadataLength -= buffer.length;
                    buffer = new Uint8Array(0);
                    continue;
                }

                metadataBytes.push(buffer.slice(0, metadataLength));
                buffer = buffer.slice(metadataLength);
                updateStreamTitle(
                    decoder.decode(
                        concatenateBytes(metadataBytes)
                    )
                );
                metadataBytes = [];
                metadataLength = null;
                audioRemaining = interval;
            }
        }
    }
    catch (error) {
        if (!signal.aborted) {
            metadataText.textContent =
                `Station metadata unavailable: ${error.message}`;
        }
    }
}


function concatenateBytes(chunks) {

    const length =
        chunks.reduce((total, chunk) => total + chunk.length, 0);
    const result = new Uint8Array(length);
    let offset = 0;

    for (const chunk of chunks) {
        result.set(chunk, offset);
        offset += chunk.length;
    }

    return result;
}


function updateStationList() {

    stationSelect.replaceChildren();

    if (!state.series.length) {
        stationSelect.disabled = true;

        const option = document.createElement("option");
        option.textContent = "No audio source loaded";
        stationSelect.append(option);
        return;
    }

    stationSelect.disabled = false;

    state.series.forEach((record, index) => {
        const option = document.createElement("option");
        option.value = String(index);
        option.textContent = `${index + 1}. ${record.title}`;
        option.selected = index === state.index;
        stationSelect.append(option);
    });
}


/* =========================================================
   PLAY RECORD
   ========================================================= */

function prepareRecord(record) {

    validate(record);

    state.currentUrl = record.urlFileName;
    fillRecordFields(record);
    showRecord(record);
    updateSourceType(record);
    updateStationList();

    if (isYouTube(record.urlFileName)) {
        openYoutubeBtn.disabled = false;
        loadYouTubeRecord(record, false).catch((error) => {
            message(
                `YouTube load error:\n${error.message}`,
                "error"
            );
        });
        return;
    }

    openYoutubeBtn.disabled = true;

    /*
    ---------------------------------------------------------
    LIVE RADIO
    ---------------------------------------------------------
    */

    if (
        state.sourceType === "stream"
    ) {

        /*
            VERY IMPORTANT:

            Do NOT fetch the radio.

            Do NOT convert it to Blob.

            Give the stream directly to <audio>.
        */

        audio.pause();
        audio.src = record.urlFileName;
        audio.load();
        monitorMetadata(record.urlFileName);

        return;
    }

    stopMetadataMonitor();
    metadataText.textContent = "Station metadata: not available for this file";


    /*
    ---------------------------------------------------------
    CSV / NORMAL SERVER AUDIO
    ---------------------------------------------------------
    */

    const src =
        serverURL(
            record.urlFileName
        );

    audio.pause();

    audio.src = src;

    audio.load();
}

async function playRecord(record) {

    if (isYouTube(record.urlFileName)) {
        validate(record);
        fillRecordFields(record);
        showRecord(record);
        updateSourceType(record);
        updateStationList();
        await playYouTubeRecord(record);
        rememberLastPlayback(record);
        updateDebug();
        return;
    }

    prepareRecord(record);

    await audio.play();

    state.playing = true;
    state.paused = false;
    rememberLastPlayback(record);

    updateDebug();
}


/* =========================================================
   LOAD CSV FROM SERVER
   ========================================================= */

async function loadCSV(url, shouldPlay = false) {

    const response =
        await fetch(url);

    if (!response.ok) {

        throw new Error(
            `CSV HTTP error ${response.status}`
        );
    }

    const text =
        await response.text();

    const lines =
        text
        .replace(/^\uFEFF/,"")
        .split(/\r?\n/);

    const records = [];

    for (
        let i=0;
        i<lines.length;
        i++
    ) {

        const line =
            lines[i].trim();

        if (!line)
            continue;

        /*
            optional header
        */

        if (
            i === 0 &&
            /^author\s*\|\s*title\s*\|\s*urlfilename(?:\s*\|\s*urllyric)?$/i
                .test(line)
        ) {
            continue;
        }

        const parts =
            line.split("|");

        if (parts.length < 3 || parts.length > 4) {

            throw new Error(
                `Invalid CSV line ${i+1}`
            );
        }

        const record = {

            author:parts[0].trim(),

            title:parts[1].trim(),

            urlFileName:parts[2].trim(),

            urlLyric:parts[3] ? parts[3].trim() : ""
        };

        validate(record);

        records.push(record);
    }

    if (!records.length) {

        throw new Error(
            "CSV is empty."
        );
    }

    state.sourceType = "csv";

    state.series = records;

    state.index = 0;

    state.currentUrl = url;

    state.previousUrl = url;

    fillRecordFields(records[0]);

    if (isYouTube(records[0].urlFileName)) {
        if (shouldPlay) {
            loadYouTubeRecord(records[0], true).catch(error => {
                message(`YouTube playback error:\n${error.message}`, "error");
            });
        } else {
            prepareRecord(records[0]);
        }
    } else {
        prepareRecord(records[0]);

        if (shouldPlay) {
            audio.play().catch(error => {
                message(`Audio playback error:\n${error.message}`, "error");
            });
        }
    }

    message(
        shouldPlay
            ? `CSV loaded: ${records.length} records and playing.`
            : `CSV loaded: ${records.length} records. Press PLAY to start.`,
        "success"
    );
}


/* =========================================================
   LOAD
   ========================================================= */

async function loadAction() {

    try {

        const value =
            urlFileName.value.trim();

        /*
            EMPTY:

            On server version, open file picker.

            This is mainly for importing a local CSV/audio
            file from the user's computer.
        */

        if (!value) {

            await chooseLocalFile();

            return;
        }


        if (isYouTube(value)) {

            const record = {
                author: author.value.trim(),
                title: title.value.trim(),
                urlFileName: value,
                urlLyric: urlLyric.value.trim()
            };

            validate(record);
            state.sourceType = "youtube";
            state.series = [record];
            state.index = 0;
            state.currentUrl = value;
            state.previousUrl = value;

            if (autoplayCheckbox.checked) {
                await playRecord(record);
            } else {
                prepareRecord(record);
            }

            message(
                autoplayCheckbox.checked
                    ? "YouTube audio loaded and playing."
                    : "YouTube audio loaded. Press PLAY to start.",
                "success"
            );
            return;
        }


        /*
            LIVE RADIO
        */

        if (isStream(value)) {

            const record = {

                author:author.value.trim(),

                title:title.value.trim(),

                urlFileName:value,

                urlLyric:urlLyric.value.trim()
            };

            validate(record);

            state.sourceType =
                "stream";

            state.series =
                [record];

            state.index = 0;

            state.currentUrl =
                value;

            state.previousUrl =
                value;

            if (autoplayCheckbox.checked) {
                await playRecord(record);
            } else {
                prepareRecord(record);
            }

            message(
                autoplayCheckbox.checked
                    ? "Live radio stream loaded and playing."
                    : "Live radio stream loaded. Press PLAY to start.",
                "success"
            );

            return;
        }


        /*
            REMOTE CSV
        */

        if (
            isHTTP(value) &&
            isCSV(value)
        ) {

            await loadCSV(value, autoplayCheckbox.checked);

            return;
        }


        /*
            NORMAL SERVER AUDIO
        */

        const record = {

            author:author.value.trim(),

            title:title.value.trim(),

            urlFileName:value,

            urlLyric:urlLyric.value.trim()
        };

        validate(record);

        state.sourceType =
            "single";

        state.series =
            [record];

        state.index = 0;

        state.currentUrl =
            value;

        state.previousUrl =
            value;

        if (autoplayCheckbox.checked) {
            await playRecord(record);
        } else {
            prepareRecord(record);
        }

        message(
            autoplayCheckbox.checked
                ? "Audio loaded and playing."
                : "Audio loaded. Press PLAY to start.",
            "success"
        );

    }
    catch(error) {

        console.error(error);

        message(
            "LOAD error:\n" +
            error.message,
            "error"
        );
    }

    updateDebug();
}


/* =========================================================
   CHOOSE LOCAL FILE
   ========================================================= */

function chooseLocalFile() {

    return new Promise((resolve,reject) => {

        const input =
            document.createElement("input");

        input.type = "file";

        input.accept =
            ".csv,.m3u,.m3u8,.mp3,.wav,.ogg,.oga,.m4a,.aac,.flac,.webm,audio/*";

        input.onchange = async function() {

            if (!input.files.length) {

                resolve();
                return;
            }

            const file =
                input.files[0];

            try {

                const fileName =
                    file.name.toLowerCase();

                if (
                    fileName.endsWith(".m3u") ||
                    fileName.endsWith(".m3u8")
                ) {

                    const records =
                        parseM3U(await file.text());

                    state.sourceType = "csv";
                    state.series = records;
                    state.index = 0;
                    state.currentUrl = file.name;
                    state.previousUrl = file.name;

                    if (autoplayCheckbox.checked) {
                        await playRecord(records[0]);
                    } else {
                        prepareRecord(records[0]);
                    }

                    message(
                        autoplayCheckbox.checked
                            ? `M3U loaded: ${records.length} stations and playing.`
                            : `M3U loaded: ${records.length} stations. Press PLAY to start.`,
                        "success"
                    );

                } else if (fileName.endsWith(".csv")) {

                    const text =
                        await file.text();

                    const lines =
                        text
                        .replace(/^\uFEFF/, "")
                        .split(/\r?\n/);

                    const records = [];

                    for (let i = 0; i < lines.length; i++) {

                        const line = lines[i];

                        if (!line.trim())
                            continue;

                        if (
                            i === 0 &&
                            /^author\s*\|\s*title\s*\|\s*urlfilename(?:\s*\|\s*urllyric)?$/i
                                .test(line.trim())
                        ) {
                            continue;
                        }

                        const parts =
                            line.split("|");

                        if (
                            parts.length < 3 ||
                            parts.length > 4
                        )
                            continue;

                        const record = {

                            author:
                                parts[0].trim(),

                            title:
                                parts[1].trim(),

                            urlFileName:
                                parts[2].trim(),

                            urlLyric:
                                parts[3] ? parts[3].trim() : ""
                        };

                        validate(record);

                        records.push(record);
                    }

                    if (!records.length)
                        throw new Error(
                            "CSV is empty."
                        );

                    state.sourceType =
                        "csv";

                    state.series =
                        records;

                    state.index = 0;

                    state.currentUrl =
                        file.name;

                    state.previousUrl =
                        file.name;

                    fillRecordFields(records[0]);

                    /*
                        Server pages cannot resolve arbitrary
                        client Desktop filenames.

                        The CSV therefore works best when its
                        audio URLs are server URLs.
                    */

                    if (autoplayCheckbox.checked) {
                        playRecord(records[0]).catch(error => {
                            message(`Audio playback error:\n${error.message}`, "error");
                        });
                    } else {
                        prepareRecord(records[0]);
                    }

                    message(
                        autoplayCheckbox.checked
                            ? `Local CSV loaded: ${records.length} records and playing.`
                            : `Local CSV loaded: ${records.length} records. Press PLAY to start.`,
                        "success"
                    );

                } else {

                    const objectURL =
                        URL.createObjectURL(
                            file
                        );

                    const record = {

                        author:
                            author.value.trim(),

                        title:
                            title.value.trim(),

                        urlFileName:
                            file.name,

                        urlLyric:
                            urlLyric.value.trim()
                    };

                    validate(record);

                    state.sourceType =
                        "single";

                    state.series =
                        [record];

                    state.index = 0;

                    state.currentUrl =
                        file.name;

                    state.previousUrl =
                        file.name;

                    audio.src =
                        objectURL;

                    audio.load();

                    if (autoplayCheckbox.checked) {
                        await audio.play();
                        state.playing = true;
                    } else {
                        state.playing = false;
                    }

                    showRecord(record);
                    updateSourceType(record);

                    message(
                        autoplayCheckbox.checked
                            ? `Local audio loaded and playing: ${file.name}`
                            : `Local audio loaded: ${file.name}. Press PLAY to start.`,
                        "success"
                    );
                }

                resolve();

            } catch(error) {

                reject(error);
            }
        };

        input.click();
    });
}


/* =========================================================
   PLAY BUTTON
   ========================================================= */

async function playAction() {

    try {

        const userValue =
            urlFileName.value.trim();


        /*
        -------------------------------------------------------
        NOT PLAYING
        -------------------------------------------------------
        */

        if (!state.playing) {

            /*
                If paused and same URL:
                continue previous item.
            */

            if (
                state.paused &&
                state.index !== null &&
                userValue === state.currentUrl
            ) {

                if (isYouTube(userValue)) {
                    youtubePlayer.playVideo();
                } else {
                    await audio.play();
                }

                state.playing = true;
                state.paused = false;

                pauseCheckbox.checked = false;

                message(
                    "Playback resumed.",
                    "success"
                );

                return;
            }


            /*
                Empty field:

                DB first record.
            */

            if (!userValue) {

                if (
                    state.index !== null &&
                    state.series[state.index]
                ) {

                    await playRecord(
                        state.series[state.index]
                    );

                    message(
                        "Playing the loaded item.",
                        "success"
                    );

                    return;
                }

                const records =
                    await getRecords();

                if (!records.length) {

                    message(
                        "DB empty, you need to load a CSV from your local desktop or remotely, or some sound file/radio stream."
                    );

                    return;
                }

                state.series =
                    records;

                state.index = 0;

                /*
                    Detect stream.
                */

                state.sourceType =
                    isStream(
                        records[0].urlFileName
                    )
                    ? "stream"
                    : "db";

                state.currentUrl = "";

                await playRecord(
                    records[0]
                );

                return;
            }


            if (isYouTube(userValue)) {

                const record = {
                    author: author.value.trim(),
                    title: title.value.trim(),
                    urlFileName: userValue,
                    urlLyric: urlLyric.value.trim()
                };

                validate(record);
                state.sourceType = "youtube";
                state.series = [record];
                state.index = 0;
                state.currentUrl = userValue;
                state.previousUrl = userValue;
                await playRecord(record);
                return;
            }


            /*
                User entered radio stream.
            */

            if (isStream(userValue)) {

                const record = {

                    author:
                        author.value.trim(),

                    title:
                        title.value.trim(),

                    urlFileName:
                        userValue,

                    urlLyric:
                        urlLyric.value.trim()
                };

                validate(record);

                state.sourceType =
                    "stream";

                state.series =
                    [record];

                state.index = 0;

                state.currentUrl =
                    userValue;

                state.previousUrl =
                    userValue;

                await playRecord(record);

                return;
            }


            /*
                User entered CSV.
            */

            if (
                isCSV(userValue)
            ) {

                await loadCSV(
                    serverURL(userValue),
                    true
                );

                return;
            }


            /*
                User entered normal audio.
            */

            const record = {

                author:
                    author.value.trim(),

                title:
                    title.value.trim(),

                urlFileName:
                    userValue,

                urlLyric:
                    urlLyric.value.trim()
            };

            validate(record);

            state.sourceType =
                "single";

            state.series =
                [record];

            state.index = 0;

            state.currentUrl =
                userValue;

            state.previousUrl =
                userValue;

            await playRecord(record);

            return;
        }


        /*
        -------------------------------------------------------
        CURRENTLY PLAYING
        -------------------------------------------------------
        */

        /*
            Same URL:

            advance to next item.

            For a stream:
            restart the same stream.
        */

        if (
            userValue &&
            userValue === state.currentUrl
        ) {

            if (
                state.sourceType === "stream"
            ) {

                state.index = 0;

                await playRecord(
                    state.series[0]
                );

                message(
                    "Radio stream restarted.",
                    "success"
                );

                return;
            }


            /*
                CSV series.
            */

            if (
                state.series.length > 1
            ) {

                state.index =
                    (
                        state.index + 1
                    ) %
                    state.series.length;

            } else {

                /*
                    Single audio:
                    its own next song.
                */

                state.index = 0;
            }

            await playRecord(
                state.series[state.index]
            );

            message(
                `Playing item ${state.index+1} of ${state.series.length}.`,
                "success"
            );

            return;
        }


        /*
            Different URL OR empty:

            keep current index and replay
            the same current item.
        */

        if (
            state.index !== null &&
            state.series[state.index]
        ) {

            await playRecord(
                state.series[state.index]
            );

            message(
                "Current item replayed; index kept."
            );

            return;
        }

    }
    catch(error) {

        console.error(error);

        message(
            "PLAY error:\n" +
            error.message,
            "error"
        );
    }

    updateDebug();
}

youtubePlaylistSelect.addEventListener(
    "change",
    function() {

        const index =
            Number.parseInt(youtubePlaylistSelect.value, 10);
        const playlistInfo =
            youtubePlaylistInfo(state.currentUrl);

        if (!playlistInfo || !youtubePlayer) {
            return;
        }

        youtubePlayer.loadPlaylist({
            list: playlistInfo.list,
            index
        });
        message(
            `YouTube playlist item ${index + 1} loaded.`,
            "success"
        );
    }
);


/* =========================================================
   STOP
   ========================================================= */

function stopAction() {

    stopMetadataMonitor();
    youtubeNoAudioSince = null;

    if (youtubePlayer) {
        youtubePlayer.stopVideo();
    }

    audio.pause();

    audio.removeAttribute("src");

    audio.load();

    state.sourceType = null;

    state.series = [];

    state.index = null;

    state.currentUrl = "";

    state.previousUrl = "";

    state.playing = false;

    state.paused = false;

    clearLastPlayback();

    pauseCheckbox.checked = false;
    openYoutubeBtn.disabled = true;
    updateYouTubePlaylist([], 0);

    showRecord(null);
    updateSourceType(null);
    updateStationList();

    message(
        "STOP: playback state completely reset. IndexedDB remains intact."
    );

    updateDebug();
}


async function playNextLoadedRecord() {

    const sourceType = state.sourceType;
    const records = sourceType === "db" && state.series.length > 1
        ? await getRecords()
        : state.series;

    if (records.length < 2) {
        return false;
    }

    const urlIndex = records.findIndex(record =>
        record.urlFileName === state.currentUrl
    );
    const currentIndex = urlIndex >= 0
        ? urlIndex
        : state.index >= 0 && state.index < records.length
            ? state.index
            : -1;
    const nextIndex =
        (currentIndex >= 0 ? currentIndex + 1 : 0) % records.length;

    state.sourceType = sourceType;
    state.series = records;
    state.index = nextIndex;

    await playRecord(records[nextIndex]);
    message(
        `Playing item ${nextIndex + 1} of ${records.length}.`,
        "success"
    );

    return true;
}


/* =========================================================
   SAVE
   ========================================================= */

async function saveAction() {

    try {

        if (
            saveSongCheckbox.checked &&
            state.index !== null &&
            state.series[state.index]
        ) {
            const currentRecord = {
                ...state.series[state.index],
                author: csvSafeField(author.value),
                title: csvSafeField(title.value),
                urlFileName: csvSafeField(urlFileName.value),
                urlLyric: csvSafeField(urlLyric.value)
            };

            author.value = currentRecord.author;
            title.value = currentRecord.title;
            urlFileName.value = currentRecord.urlFileName;
            urlLyric.value = currentRecord.urlLyric;

            validate(currentRecord);

            if (await recordExists(currentRecord)) {
                message("This song already exists in IndexedDB.");
                return;
            }

            await saveRecord(currentRecord);
            message("Current song saved to IndexedDB.", "success");
            return;
        }

        /*
            If a CSV is currently loaded:

            save every CSV item.
        */

        if (
            state.sourceType === "csv" &&
            state.series.length
        ) {

            let saved = 0;

            for (
                const record of state.series
            ) {

                if (
                    !await recordExists(record)
                ) {

                    await saveRecord(record);

                    saved++;
                }
            }

            message(
                `CSV saved.\nNew records: ${saved}`,
                "success"
            );

            return;
        }


        /*
            Otherwise save fields.
        */

        const record = {

            author:
                csvSafeField(author.value),

            title:
                csvSafeField(title.value),

            urlFileName:
                csvSafeField(urlFileName.value),

            urlLyric:
                csvSafeField(urlLyric.value)
        };

        author.value = record.author;
        title.value = record.title;
        urlFileName.value = record.urlFileName;
        urlLyric.value = record.urlLyric;

        validate(record);

        if (
            await recordExists(record)
        ) {

            message(
                "This record already exists."
            );

            return;
        }

        await saveRecord(record);

        message(
            "Record saved to IndexedDB.",
            "success"
        );

    }
    catch(error) {

        message(
            "SAVE error:\n" +
            error.message,
            "error"
        );
    }
}


/* =========================================================
   EXPORT CSV
   ========================================================= */

async function exportCSVAction() {

    try {

        const records =
            await getRecords();

        if (!records.length) {

            message(
                "DB is empty."
            );

            return;
        }

        const text =
            [
                "Author|Title|urlFileName|urlLyric",
                ...records.map(r =>
                    `${r.author}|${r.title}|${r.urlFileName}|${r.urlLyric || ""}`
                )
            ].join("\n");

        const blob =
            new Blob(
                [text],
                {type:"text/csv;charset=utf-8"}
            );

        const url =
            URL.createObjectURL(blob);

        const tab =
            window.open(
                "",
                "_blank"
            );

        if (!tab)
            throw new Error(
                "New tab blocked by browser."
            );

        tab.document.write(`
            <html>
            <head>
            <meta charset="UTF-8">
            <title>CSV Export</title>
            </head>
            <body>
            <h2>CSV Export</h2>

            <p>
            <a
                href="${url}"
                download="songs.csv"
            >
                Download songs.csv
            </a>
            </p>

            <pre>${escapeHTML(text)}</pre>

            </body>
            </html>
        `);

        tab.document.close();

        message(
            "CSV exported.",
            "success"
        );

    }
    catch(error) {

        message(
            "EXPORT error:\n" +
            error.message,
            "error"
        );
    }
}


function escapeHTML(text) {

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}


/* =========================================================
   DELETE DB
   ========================================================= */

async function deleteDBAction() {

    if (
        !confirm(
            "Delete all IndexedDB records?"
        )
    )
        return;

    audio.pause();

    if (db)
        db.close();

    db = null;

    await new Promise(
        (resolve,reject) => {

            const request =
                indexedDB.deleteDatabase(
                    DB_NAME
                );

            request.onsuccess =
                resolve;

            request.onerror =
                () => reject(
                    request.error
                );
        }
    );

    await openDB();

    stopAction();

    message(
        "IndexedDB deleted. All records removed.",
        "success"
    );
}


/* =========================================================
   AUDIO EVENTS
   ========================================================= */

audio.addEventListener(
    "play",
    () => {

        state.playing = true;
        state.paused = false;

        updateDebug();
    }
);


audio.addEventListener(
    "pause",
    () => {

        if (!audio.ended) {

            state.playing = false;
        }

        updateDebug();
    }
);


audio.addEventListener(
    "ended",
    async () => {

        if (handlingAudioEnd) {
            return;
        }

        handlingAudioEnd = true;

        if (
            state.sourceType === "db" &&
            !repeatCheckbox.checked
        ) {
            try {
                if (await playNextLoadedRecord()) {
                    handlingAudioEnd = false;
                    return;
                }
            }
            catch (error) {
                message(
                    "DB next-record playback failed:\n" +
                    error.message,
                    "error"
                );
            }
        }

        const isDatabasePlaylist =
            state.sourceType === "db" &&
            state.series.length > 1;
        const isLoadedPlaylist =
            (state.sourceType === "db" ||
             state.sourceType === "csv") &&
            state.series.length > 1;
        const shouldAdvancePlaylist =
            isDatabasePlaylist ||
            (autoplayCheckbox.checked && state.series.length > 1);

        if (
            shouldAdvancePlaylist &&
            state.sourceType !== "stream" &&
            state.sourceType !== "youtube" &&
            isLoadedPlaylist
        ) {
            if (repeatCheckbox.checked) {
                audio.currentTime = 0;
            } else {
                state.index =
                    (state.index + 1) % state.series.length;
            }

            try {
                await playRecord(
                    state.series[state.index]
                );
                message(
                    repeatCheckbox.checked || state.series.length <= 1
                        ? "Audio replayed."
                        : `Playing item ${state.index + 1} of ${state.series.length}.`,
                    "success"
                );
                handlingAudioEnd = false;
                return;
            }
            catch (error) {
                message(
                    "Audio replay failed:\n" +
                    error.message,
                    "error"
                );
            }
        }

        if (
            autoplayCheckbox.checked &&
            !repeatCheckbox.checked &&
            state.sourceType !== "stream" &&
            state.sourceType !== "youtube" &&
            state.series.length === 1
        ) {
            try {
                audio.currentTime = 0;
                await audio.play();
                handlingAudioEnd = false;
                return;
            }
            catch (error) {
                message(
                    "Audio replay failed:\n" +
                    error.message,
                    "error"
                );
            }
        }

        state.playing = false;

        updateDebug();

        message(
            "Audio ended. Press PLAY."
        );

        handlingAudioEnd = false;
    }
);


audio.addEventListener(
    "error",
    () => {

        state.playing = false;

        let text =
            "Audio error.";

        if (audio.error) {

            if (
                audio.error.code === 2
            )
                text =
                    "Network error while loading audio/stream.";

            if (
                audio.error.code === 3
            )
                text =
                    "The browser could not decode this audio stream.";

            if (
                audio.error.code === 4
            )
                text =
                    "The browser does not support this audio source.";
        }

        message(
            text,
            "error"
        );

        updateDebug();
    }
);


/* =========================================================
   BUTTONS
   ========================================================= */

document
    .getElementById("loadBtn")
    .onclick =
    loadAction;

document
    .getElementById("playBtn")
    .onclick =
    playAction;

document
    .getElementById("stopBtn")
    .onclick =
    stopAction;

document
    .getElementById("saveBtn")
    .onclick =
    saveAction;

document
    .getElementById("exportBtn")
    .onclick =
    exportCSVAction;

document
    .getElementById("deleteDbBtn")
    .onclick =
    deleteDBAction;

openYoutubeBtn.onclick =
    openCurrentYouTube;

lyricBtn.onclick = function() {

    const lyricUrl = urlLyric.value.trim();

    if (!lyricUrl) {
        message("No lyric URL is available.", "error");
        return;
    }

    try {
        const parsed = new URL(lyricUrl, document.baseURI);

        if (!/^https?:$/.test(parsed.protocol)) {
            throw new Error("Lyric URL must use HTTP or HTTPS.");
        }

        window.open(parsed.href, "_blank", "noopener");
    }
    catch (error) {
        message(
            `Lyric URL error:\n${error.message}`,
            "error"
        );
    }
};


/* =========================================================
   START
   ========================================================= */

async function initialize() {

    try {

        await openDB();

        const records =
            await getRecords();

        if (!records.length) {

            const record = DEFAULT_RADIO_RECORD;

            state.sourceType = "stream";
            state.series = [record];
            state.index = 0;
            state.currentUrl = record.urlFileName;
            state.previousUrl = record.urlFileName;

            author.value = record.author;
            title.value = record.title;
            urlFileName.value = record.urlFileName;

            showRecord(record);
            audio.autoplay = true;

            playRecord(record).catch(error => {
                if (error.name === "NotAllowedError") {
                    message(
                        "Radio stream loaded. Click PLAY to start it."
                    );

                    const startRadio = async () => {
                        document.removeEventListener("pointerdown", startRadio);

                        try {
                            await playRecord(record);
                            message("Playing: My Blues Radio.", "success");
                        }
                        catch(retryError) {
                            message(
                                "Radio playback failed:\n" +
                                retryError.message,
                                "error"
                            );
                        }
                    };

                    document.addEventListener(
                        "pointerdown",
                        startRadio,
                        {once: true}
                    );
                } else {
                    message(
                        "Radio stream loaded but playback failed:\n" +
                        error.message,
                        "error"
                    );
                }
            });

            updateDebug();
            message("Ready.");

            return;
        }


        /*
            Refresh:

            load first DB record.
        */

        state.series =
            records;

        state.index = getLastPlaybackIndex(records);

        state.sourceType =
            isStream(
                records[state.index].urlFileName
            )
            ? "stream"
            : "db";

        fillRecordFields(records[state.index]);

        showRecord(
            records[state.index]
        );

        updateDebug();


        /*
            Try autoplay.
        */

        playRecord(records[state.index]).catch(error => {

            if (
                error.name ===
                "NotAllowedError"
            ) {

                message(
                    "DB loaded. Browser autoplay was blocked. Press PLAY."
                );

            } else {

                message(
                    "DB loaded but playback failed:\n" +
                    error.message,
                    "error"
                );
            }
        });

    }
    catch(error) {

        message(
            "Initialization error:\n" +
            error.message,
            "error"
        );
    }

    updateDebug();
    setInitializedMessage();
}


initialize();

</script>
